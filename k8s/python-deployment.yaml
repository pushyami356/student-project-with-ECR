apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-management-python
  namespace: student-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-management-python

  template:
    metadata:
      labels:
        app: student-management-python

    spec:
      containers:
        - name: python

          image: 836003244254.dkr.ecr.eu-north-1.amazonaws.com/student-python:a1b2c3d4e5f67890

          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: mysql

            - name: DB_NAME
              value: student_management

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
