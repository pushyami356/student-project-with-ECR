name: Student Management CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 836003244254.dkr.ecr.eu-north-1.amazonaws.com
  PHP_IMAGE: 836003244254.dkr.ecr.eu-north-1.amazonaws.com/student-php
  PYTHON_IMAGE: 836003244254.dkr.ecr.eu-north-1.amazonaws.com/student-python

jobs:

  # -----------------------------------------------
  # JOB 1: CODE VALIDATION AND SECURITY SCANNING
  # -----------------------------------------------
  ci:
    name: Test and Security
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: PHP Syntax Check
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            php:8.2-cli \
            sh -c 'find . -name "*.php" -not -path "./.git/*" -exec php -l {} \;'

      - name: Python Syntax Check
        run: |
          python3 -m compileall -q python/

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # -----------------------------------------------
  # JOB 2: BUILD AND PUSH IMAGES TO AMAZON ECR
  # -----------------------------------------------
  docker:
    name: Build and Push to Amazon ECR
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Create image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push PHP image
        run: |
          docker build \
            -f Dockerfile \
            -t "$PHP_IMAGE:$IMAGE_TAG" \
            .

          docker push "$PHP_IMAGE:$IMAGE_TAG"

      - name: Build and push Python image
        run: |
          docker build \
            -f python/Dockerfile \
            -t "$PYTHON_IMAGE:$IMAGE_TAG" \
            ./python

          docker push "$PYTHON_IMAGE:$IMAGE_TAG"

      # -----------------------------------------------
      # UPDATE KUBERNETES DEPLOYMENT MANIFESTS
      # -----------------------------------------------
      - name: Update Kubernetes image references
        run: |
          sed -i \
            "s|image: .*student-management-php:.*|image: $PHP_IMAGE:$IMAGE_TAG|" \
            k8s/php-deployment.yaml

          sed -i \
            "s|image: .*student-management-python:.*|image: $PYTHON_IMAGE:$IMAGE_TAG|" \
            k8s/python-deployment.yaml

      - name: Commit Kubernetes image updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/php-deployment.yaml \
            k8s/python-deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes"
            exit 0
          fi

          git commit -m "ci: update ECR images to $IMAGE_TAG"

          git push origin HEAD:main

